[tool.black]
line-length = 240

[tool.isort]
profile = "black"
line_length = 240

[tool.ruff]
line-length = 240

[tool.ruff.lint]
ignore = ["E203"]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"ML/core/triposr/**" = ["E501", "F401", "F541"]

[tool.pyright]
extraPaths = ["Backend", "."]
include = ["Backend", "ML"]
reportMissingImports = "none"

[tool.pytest.ini_options]
pythonpath = ["Backend", "."]
